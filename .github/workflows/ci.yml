name: CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          install() {
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev pkg-config
          }
          # when Canonical's servers don't resolve, a university mirror outside ubuntu.com. apt still
          # checks Ubuntu's signatures on everything it fetches
          if ! install; then
            mirror=http://mirrors.ocf.berkeley.edu
            for list in /etc/apt/sources.list $(grep -rl ubuntu.com /etc/apt/sources.list.d || true); do
              sudo sed -i -E \
                -e "s#mirror\+file:/etc/apt/apt-mirrors.txt#$mirror/ubuntu/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu-ports/?#$mirror/ubuntu-ports/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu/?#$mirror/ubuntu/#" "$list"
            done
            install
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-test

      - name: Run tests
        run: cargo test --workspace --locked

  lint:
    name: Clippy & Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          install() {
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev pkg-config
          }
          # when Canonical's servers don't resolve, a university mirror outside ubuntu.com. apt still
          # checks Ubuntu's signatures on everything it fetches
          if ! install; then
            mirror=http://mirrors.ocf.berkeley.edu
            for list in /etc/apt/sources.list $(grep -rl ubuntu.com /etc/apt/sources.list.d || true); do
              sudo sed -i -E \
                -e "s#mirror\+file:/etc/apt/apt-mirrors.txt#$mirror/ubuntu/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu-ports/?#$mirror/ubuntu-ports/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu/?#$mirror/ubuntu/#" "$list"
            done
            install
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-lint

      - name: Format check (nightly)
        run: cargo +nightly fmt --all --check

      - name: Clippy check
        run: cargo +stable clippy --workspace --all-targets
