name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          install() {
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev pkg-config
          }
          # when Canonical's servers don't resolve, a university mirror outside ubuntu.com. apt still
          # checks Ubuntu's signatures on everything it fetches
          if ! install; then
            mirror=http://mirrors.ocf.berkeley.edu
            for list in /etc/apt/sources.list $(grep -rl ubuntu.com /etc/apt/sources.list.d || true); do
              sudo sed -i -E \
                -e "s#mirror\+file:/etc/apt/apt-mirrors.txt#$mirror/ubuntu/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu-ports/?#$mirror/ubuntu-ports/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu/?#$mirror/ubuntu/#" "$list"
            done
            install
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          install() {
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev pkg-config
          }
          # when Canonical's servers don't resolve, a university mirror outside ubuntu.com. apt still
          # checks Ubuntu's signatures on everything it fetches
          if ! install; then
            mirror=http://mirrors.ocf.berkeley.edu
            for list in /etc/apt/sources.list $(grep -rl ubuntu.com /etc/apt/sources.list.d || true); do
              sudo sed -i -E \
                -e "s#mirror\+file:/etc/apt/apt-mirrors.txt#$mirror/ubuntu/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu-ports/?#$mirror/ubuntu-ports/#" \
                -e "s#https?://[a-z.]*ubuntu\.com/ubuntu/?#$mirror/ubuntu/#" "$list"
            done
            install
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mmd_cli -p octamedic_gui

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          for pair in cli:mmd_cli gui:octamedic_gui; do
            kind="${pair%%:*}"; bin="${pair#*:}"
            zip "$GITHUB_WORKSPACE/octamedic-${kind}-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" "$bin"
          done

      # the GUI goes in an app bundle, so it has its icon and name and opens from Finder. ditto
      # zips it the way Finder does
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          suffix="${GITHUB_REF_NAME}-${{ matrix.target }}"
          zip -j "octamedic-cli-${suffix}.zip" "target/${{ matrix.target }}/release/mmd_cli"
          octamedic_gui/macos/bundle.sh ${{ matrix.target }} "${GITHUB_REF_NAME#v}" bundle
          ditto -c -k --keepParent bundle/OctaMEDIC.app "octamedic-gui-${suffix}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bins = @{ cli = "mmd_cli"; gui = "octamedic_gui" }
          foreach ($kind in $bins.Keys) {
            $archive = "octamedic-$kind-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
            Compress-Archive -Path "target/${{ matrix.target }}/release/$($bins[$kind]).exe" -DestinationPath $archive
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: octamedic-*.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog entry
        id: notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == tag) ; next }
            found { print }
          ' docs/CHANGELOG.md 2>/dev/null > notes.md || true
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
