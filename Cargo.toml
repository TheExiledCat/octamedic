[workspace]
members = ["mmd", "mmd_cli", "octamedic_core", "octamedic_gui", "octamedic_util", "rustuition"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

# the code ends every function with an explicit return
[workspace.lints.clippy]
needless_return = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = "z"

[profile.dev.package."*"]
debug = false

# wgpu-core turns on the Vulkan validation layer (VK_LAYER_KHRONOS_validation) in builds with
# debug assertions, whenever the layer is installed, as it is with the Vulkan SDK or a distro's
# validation layers package. It checks every Vulkan call, which took the GUI from about 46 FPS to 5
# on a Linux machine that had it, while Windows and WSL, without it, were unaffected. Debug
# assertions are per crate, so turning them off here only stops wgpu asking for validation.
[profile.dev.package.wgpu-core]
debug-assertions = false

# wgpu-hal 0.16 takes one off its DX12 exception handler count when the instance drops even when it
# never added one, which it only does with validation, off above. Closing a debug build on Windows
# then panicked with "attempt to subtract with overflow"; release builds wrap it silently
[profile.dev.package.wgpu-hal]
overflow-checks = false

# the screen filters go over every pixel each frame: a chain of six took about 29ms a frame at
# opt-level "z" and 10ms at 3
[profile.dev.package.rustuition]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true
