[workspace]
members = ["octamed", "octamed_cli", "octamedic_core", "octamedic_gui", "octamedic_util"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

# the code ends every function with an explicit return
[workspace.lints.clippy]
needless_return = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = "z"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
