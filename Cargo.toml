[workspace]
members = ["octamed", "octamed_cli", "octamedic_core", "octamedic_gui"]
resolver = "3"

# the code ends every function with an explicit return
[workspace.lints.clippy]
needless_return = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = "z"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
