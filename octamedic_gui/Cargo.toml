[package]
name = "octamedic_gui"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

[dependencies]
octamedic_util = {path="../octamedic_util"}
mmd = {path="../mmd"}
octamedic_core = {path="../octamedic_core"}
rustuition = { path = "../rustuition", features = ["ggez"] }
ggez = { version = "0.9.3", default-features = false }
dirs = "6.0.0"
ab_glyph = "0.2.32"
fs4 = "1.1.0"
bytesize = "2.7.0"
serde = { version = "1.0", features = ["derive"] }
# toml 0.5 is already in Cargo.lock from ggez, so staying on 0.5 avoids an extra dependency
toml = "0.5"
# what ggez decodes images with already, for the pointer's pixels
image = { version = "0.24", default-features = false, features = ["png"] }
# already in Cargo.lock from ggez and wgpu, whose errors only go through it
log = "0.4"

[target.'cfg(windows)'.dependencies]
# for the crash alert; dirs and fs4 build this windows-sys already
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# to answer the app delegate's applicationShouldTerminate:, cpal builds it already
objc2 = "0.6.4"

[lints]
workspace = true
